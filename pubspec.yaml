name: fin_pay
description: "FinPay - A modern financial payment app with CRED-like design and smooth animations. Manage your money, make payments, track expenses, and stay in control of your finances."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4
  flutter: ">=3.47.9"

dependencies:
  animations: ^3.0.0
  clock: ^1.1.3
  crypto: ^3.0.8
  cupertino_icons: ^2.0.0
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  flutter_staggered_animations: ^1.1.1
  flutter_svg: ^2.0.10+1
  get_it: ^9.2.0
  go_router: ^18.1.2
  intl: ^0.20.3
  local_auth: ^3.0.2
  neopop: ^1.0.2
  path: ^1.9.0
  sensors_plus: ^7.1.1
  shared_preferences: ^2.3.2
  shimmer: ^4.0.0
  sqflite: ^2.3.3+2
  url_launcher: ^6.2.5
  vibration: ^3.1.5

dev_dependencies:
  bloc_test: ^10.0.0
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.4.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
