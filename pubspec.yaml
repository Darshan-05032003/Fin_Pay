name: fin_pay
description: "FinPay - A modern financial payment app with CRED-like design and smooth animations. Manage your money, make payments, track expenses, and stay in control of your finances."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4
  flutter: ">=3.47.9"

dependencies:
  animations: ^3.0.0
  clock: ^1.1.3
  crypto: ^3.0.8
  equatable: ^3.0.0
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_native_splash: ^2.4.8
  flutter_secure_storage: ^11.2.0
  get_it: ^9.2.0
  go_router: ^18.1.2
  intl: ^0.20.3
  local_auth: ^3.0.2
  neopop: ^1.0.2
  path: ^1.9.0
  sensors_plus: ^7.1.1
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+2
  vibration: ^3.1.5

dev_dependencies:
  bloc_test: ^10.0.0
  fake_async: ^1.3.3
  flutter_driver:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.4.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic

# App icon (original design, rendered by tool/render_brand_assets.dart).
# Regenerate: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icon.png
  adaptive_icon_background: "#0B0B0D"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  adaptive_icon_monochrome: assets/brand/icon_monochrome.png
  min_sdk_android: 21
  remove_alpha_ios: true

# Native splash (same background as FpColors.background; no white frame).
# Regenerate: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0B0B0D"
  image: assets/brand/splash.png
  android: true
  ios: true
  web: false
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#0B0B0D"
    image: assets/brand/splash_android12.png
    icon_background_color: "#0B0B0D"
