name: fin_pay
description: "FinPay - A modern financial payment app with CRED-like design and smooth animations. Manage your money, make payments, track expenses, and stay in control of your finances."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4
  flutter: ">=3.47.9"

dependencies:
  animated_text_kit: ^4.2.2
  animations: ^3.0.0
  confetti: ^0.8.0
  cupertino_icons: ^2.0.0
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  flutter_bloc: ^9.1.1
  flutter_staggered_animations: ^1.1.1
  flutter_svg: ^2.0.10+1
  get_it: ^9.2.0
  go_router: ^18.1.2
  http: ^1.2.2
  injectable: ^3.0.0
  intl: ^0.20.3
  lottie: ^3.1.2
  path: ^1.9.0
  shared_preferences: ^2.3.2
  shimmer: ^4.0.0
  smooth_page_indicator: ^3.0.0
  sqflite: ^2.3.3+2
  url_launcher: ^6.2.5
  vibration: ^3.1.5

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.10.5
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.4.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
